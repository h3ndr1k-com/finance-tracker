<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f3ec">
<title>Ledger</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root {
  --bg: #f6f3ec;
  --card: #fffdf8;
  --ink: #1d2129;
  --muted: #8b8677;
  --hairline: #e7e2d6;
  --accent: #0e6b5c;
  --accent-soft: #e9f0ea;
  --coral: #c9553a;
  --coral-soft: #f7e9e3;
  --gold: #c9a54a;
  --radius: 16px;
  --shadow: 0 1px 2px rgba(29,33,41,.04), 0 8px 24px -12px rgba(29,33,41,.10);
  --display: ui-serif, "New York", Georgia, "Times New Roman", serif;
  --body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
}
:root[data-theme="dark"] {
  --bg: #12141a;
  --card: #1a1d26;
  --ink: #ece9e2;
  --muted: #837f74;
  --hairline: #2a2e3a;
  --accent: #45a892;
  --accent-soft: #1e2a27;
  --coral: #e07856;
  --coral-soft: #2e211c;
  --gold: #d4b25e;
  --shadow: 0 1px 2px rgba(0,0,0,.2), 0 8px 24px -12px rgba(0,0,0,.5);
}
* { box-sizing: border-box; margin: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font: 15px/1.5 var(--body);
  padding-bottom: env(safe-area-inset-bottom);
  transition: background .25s;
}
.num { font-variant-numeric: tabular-nums; }
.serif { font-family: var(--display); letter-spacing: -0.015em; }

header {
  position: sticky; top: 0; z-index: 20;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--hairline);
  padding: 0 20px; padding-top: env(safe-area-inset-top);
  display: flex; align-items: center; gap: 6px; height: calc(58px + env(safe-area-inset-top));
}
header h1 { font-family: var(--display); font-size: 21px; font-weight: 600; margin-right: 22px; }
header h1::after { content: "."; color: var(--accent); }
nav.topnav { display: flex; gap: 2px; flex: 1; }
nav.topnav button {
  background: none; border: none; color: var(--muted); font: inherit; font-size: 14px;
  padding: 7px 13px; border-radius: 99px; cursor: pointer; transition: color .15s, background .15s;
}
nav.topnav button.active { color: var(--card); background: var(--ink); font-weight: 500; }
.iconbtn { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 16px; padding: 7px 9px; border-radius: 10px; }
.iconbtn:hover { background: var(--accent-soft); color: var(--ink); }

main { max-width: 1020px; margin: 0 auto; padding: 22px 18px 110px; }
.view { display: none; }
.view.active { display: block; }

@keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.view.active > * { animation: fadeUp .45s cubic-bezier(.2,.7,.2,1) both; }
.view.active > *:nth-child(2) { animation-delay: .05s; }
.view.active > *:nth-child(3) { animation-delay: .10s; }
.view.active > *:nth-child(4) { animation-delay: .15s; }
.view.active > *:nth-child(5) { animation-delay: .20s; }
.view.active > *:nth-child(6) { animation-delay: .25s; }

.card {
  background: var(--card); border: 1px solid var(--hairline); border-radius: var(--radius);
  padding: 20px; margin-bottom: 16px; box-shadow: var(--shadow);
}
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: stretch; }
.grid2 > .card { margin-bottom: 0; }
.gridrow { margin-bottom: 16px; }
.jargrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; }
@media (max-width: 640px) { .grid2 { grid-template-columns: 1fr; } }

.label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; font-weight: 600; margin-bottom: 6px; }
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.cardhead .label { margin-bottom: 0; }
.hero {
  position: relative; overflow: hidden;
  background:
    radial-gradient(120% 140% at 85% -20%, color-mix(in srgb, var(--accent) 14%, transparent), transparent 55%),
    radial-gradient(90% 120% at -10% 110%, color-mix(in srgb, var(--gold) 10%, transparent), transparent 50%),
    var(--card);
}
.hero .big { font-family: var(--display); font-size: clamp(38px, 7vw, 52px); font-weight: 600; line-height: 1.05; letter-spacing: -0.02em; }
.hero .spark { margin: 14px -20px -20px; display: block; }
.mid { font-family: var(--display); font-size: 26px; font-weight: 600; letter-spacing: -0.01em; }
.sub { font-size: 13px; color: var(--muted); }
.pos { color: var(--accent); } .neg { color: var(--coral); }

.delta { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 99px; }
.delta.down { background: var(--accent-soft); color: var(--accent); }
.delta.up { background: var(--coral-soft); color: var(--coral); }

button.primary {
  background: var(--accent); color: #fff; border: none; border-radius: 11px;
  padding: 10px 18px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
  transition: transform .12s, filter .15s;
}
button.primary:hover { filter: brightness(1.08); }
button.primary:active { transform: scale(.97); }
button.ghost {
  background: var(--card); border: 1px solid var(--hairline); color: var(--ink); border-radius: 11px;
  padding: 9px 15px; font: inherit; font-size: 14px; cursor: pointer; transition: border-color .15s, background .15s;
}
button.ghost:hover { border-color: var(--accent); }
button.ghost.sm, button.primary.sm { padding: 6px 11px; font-size: 13px; }
button.danger { border-color: color-mix(in srgb, var(--coral) 50%, var(--hairline)); color: var(--coral); }
button:disabled { opacity: 0.5; cursor: default; }
.linkbtn { background: none; border: none; color: var(--accent); font: inherit; font-size: 13px; cursor: pointer; padding: 2px 4px; }

input, select {
  font: inherit; font-size: 14px; color: var(--ink); background: var(--card);
  border: 1px solid var(--hairline); border-radius: 10px; padding: 8px 11px; max-width: 100%;
}
input:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 15%, transparent); }

table { border-collapse: collapse; width: 100%; font-size: 14px; }
th {
  text-align: left; font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .07em;
  padding: 9px 10px; border-bottom: 1px solid var(--hairline); cursor: pointer; white-space: nowrap; user-select: none;
}
td { padding: 11px 10px; border-bottom: 1px solid var(--hairline); vertical-align: middle; }
tbody tr { transition: background .12s; cursor: pointer; }
tbody tr:hover { background: color-mix(in srgb, var(--accent-soft) 55%, transparent); }
tbody tr.sel { background: color-mix(in srgb, var(--accent-soft) 90%, transparent); }
tbody tr.xfer td:not(.selcol) { opacity: 0.55; }
tr:last-child td { border-bottom: none; }
td.amt { text-align: right; white-space: nowrap; }
th.amt { text-align: right; }
td.selcol, th.selcol { width: 30px; padding-right: 0; cursor: default; }
.tablewrap { overflow-x: auto; }

.dot { display: inline-block; width: 8px; height: 8px; border-radius: 3px; margin-right: 7px; vertical-align: baseline; flex: none; }
.catpill { display: inline-flex; align-items: center; }
.pill {
  display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 9px; border-radius: 99px;
  background: var(--accent-soft); color: var(--accent);
}
.pill.grey { background: var(--hairline); color: var(--muted); }
.jartag { font-size: 11px; color: var(--muted); border: 1px solid var(--hairline); border-radius: 99px; padding: 1px 8px; cursor: pointer; }
.jartag:hover { border-color: var(--accent); color: var(--ink); }
.avatar {
  display: inline-flex; align-items: center; justify-content: center; flex: none;
  width: 34px; height: 34px; border-radius: 10px; font-size: 12px; font-weight: 700; color: #fff;
}

.dropzone {
  border: 1.5px dashed var(--hairline); border-radius: var(--radius); padding: 14px 18px;
  color: var(--muted); margin-bottom: 18px; font-size: 13px;
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: space-between;
  transition: border-color .15s, background .15s;
}
.dropzone.drag { border-color: var(--accent); background: var(--accent-soft); }
.dropzone .actions { display: flex; gap: 8px; flex-wrap: wrap; }
.dropzone .actions button { padding: 7px 13px; font-size: 13px; }

.filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; align-items: center; }
.filters input[type="search"] { flex: 1; min-width: 150px; }

.bulkbar {
  display: none; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 14px;
  background: var(--ink); color: var(--bg); border-radius: 12px; padding: 10px 14px; box-shadow: var(--shadow);
}
.bulkbar.show { display: flex; }
.bulkbar .count { font-weight: 600; margin-right: 6px; }
.bulkbar select, .bulkbar button { background: transparent; color: var(--bg); border: 1px solid color-mix(in srgb, var(--bg) 35%, transparent); }
.bulkbar select option { color: var(--ink); }
.bulkbar button { cursor: pointer; border-radius: 8px; padding: 6px 10px; font: inherit; font-size: 13px; }
.bulkbar .x { margin-left: auto; }

.modal-backdrop {
  position: fixed; inset: 0; background: rgba(18,17,14,0.5); z-index: 50;
  display: none; align-items: flex-start; justify-content: center; overflow-y: auto; padding: 24px 12px;
  backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
}
.modal-backdrop.open { display: flex; }
.modal {
  background: var(--card); border-radius: 20px; border: 1px solid var(--hairline);
  padding: 24px; width: 100%; max-width: 660px; margin: auto 0; box-shadow: var(--shadow);
  animation: fadeUp .3s cubic-bezier(.2,.7,.2,1) both;
}
.modal h2 { font-family: var(--display); font-size: 20px; margin-bottom: 4px; }
.modal .sub { margin-bottom: 14px; }
.formrow { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
.formrow label { font-size: 13px; color: var(--muted); min-width: 90px; }
.formrow input, .formrow select { flex: 1; min-width: 90px; }

.barrow { margin-bottom: 15px; }
.bartrack { height: 8px; border-radius: 4px; background: var(--hairline); overflow: hidden; margin-top: 7px; }
.barfill { height: 100%; border-radius: 4px; background: var(--accent); transition: width .5s cubic-bezier(.2,.7,.2,1); }
.barfill.over { background: var(--coral); }

.previewtable td, .previewtable th { padding: 5px 8px; font-size: 13px; cursor: default; }
.catselect { border: none; background: transparent; color: var(--muted); font-size: 13px; padding: 2px 4px; cursor: pointer; }
.catselect:hover { color: var(--ink); }
.catselect:focus { box-shadow: none; }
.toast {
  position: fixed; bottom: 88px; left: 50%; transform: translateX(-50%) translateY(6px);
  background: var(--ink); color: var(--bg); padding: 11px 20px; border-radius: 12px;
  font-size: 14px; z-index: 100; opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none; max-width: 90vw;
  box-shadow: var(--shadow);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.chart { width: 100%; height: auto; display: block; }
.receiptimg { max-width: 100%; max-height: 260px; border-radius: 12px; border: 1px solid var(--hairline); display: block; margin: 0 auto 14px; }
.empty { text-align: center; color: var(--muted); padding: 40px 10px; font-size: 14px; }
.empty .serif { font-size: 22px; color: var(--ink); display: block; margin-bottom: 8px; }
.empty .actions { margin-top: 18px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

.acctlist { display: flex; flex-direction: column; gap: 4px; margin-top: 6px; }
.acctrow { display: flex; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--hairline); }
.acctrow:last-child { border-bottom: none; }
.acctrow .name { flex: 1; min-width: 0; }
.acctrow .name .sub { display: block; }
.acctrow .bal { text-align: right; white-space: nowrap; }
.acctrow .bal .sub { display: block; }

.reclist { display: flex; flex-direction: column; }
.recrow { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--hairline); }
.recrow:last-child { border-bottom: none; }
.recrow .name { flex: 1; min-width: 0; }
.recrow .name .sub { display: block; }

.legend { display: flex; gap: 16px; font-size: 12px; color: var(--muted); margin-top: 10px; }
.legend span::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 6px; }
.legend .li::before { background: var(--accent); }
.legend .le::before { background: var(--coral); }
.ratestable input { width: 110px; }
progress { width: 100%; accent-color: var(--accent); }

.donutwrap { display: flex; gap: 22px; align-items: center; flex-wrap: wrap; }
.donutwrap svg { flex: none; }
.donutlegend { flex: 1; min-width: 150px; }
.donutlegend .row { display: flex; align-items: center; font-size: 13px; padding: 5px 0; }
.donutlegend .row .lab { flex: 1; color: var(--ink); display: flex; align-items: center; min-width: 0; }
.donutlegend .row .val { color: var(--muted); }

.jarcard { background: var(--card); border: 1px solid var(--hairline); border-radius: 14px; padding: 15px; box-shadow: var(--shadow); position: relative; }
.jarcard .jtop { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.jarcard .jname { font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.jarcard .jpct { font-size: 12px; color: var(--muted); }
.jarcard .jbal { font-family: var(--display); font-size: 22px; font-weight: 600; }
.jarcard .jspend { font-size: 12px; color: var(--muted); margin-top: 2px; }
.jarcard .jedit { position: absolute; top: 10px; right: 10px; opacity: 0; transition: opacity .15s; }
.jarcard:hover .jedit { opacity: 1; }
.pctwarn { color: var(--coral); font-size: 13px; margin-top: 4px; }

nav.tabbar { display: none; }
@media (max-width: 720px) {
  nav.topnav { display: none; }
  nav.tabbar {
    display: flex; position: fixed; bottom: 0; left: 0; right: 0; z-index: 30;
    background: color-mix(in srgb, var(--card) 92%, transparent);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-top: 1px solid var(--hairline);
    padding: 8px 6px calc(8px + env(safe-area-inset-bottom));
    justify-content: space-around;
  }
  nav.tabbar button {
    background: none; border: none; color: var(--muted); font: inherit; font-size: 10px; font-weight: 600;
    display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; padding: 4px 10px; border-radius: 12px;
  }
  nav.tabbar button svg { width: 21px; height: 21px; stroke: currentColor; fill: none; }
  nav.tabbar button.active { color: var(--accent); }
}
</style>

<body>

<header>
  <h1>Ledger</h1>
  <nav class="topnav">
    <button data-view="overview" class="active">Overview</button>
    <button data-view="transactions">Transactions</button>
    <button data-view="jars">Jars</button>
    <button data-view="budgets">Budgets</button>
  </nav>
  <button class="iconbtn" id="themeBtn" title="Toggle theme">◐</button>
  <button class="iconbtn" id="settingsBtn" title="Settings">⚙</button>
</header>

<main>
  <div class="dropzone" id="dropzone">
    <div>Drop CSV statements or receipt photos anywhere here</div>
    <div class="actions">
      <button class="ghost" id="addTxBtn">+ Add</button>
      <button class="ghost" id="pickCsvBtn">Import CSV</button>
      <button class="ghost" id="pickImgBtn">Upload receipt</button>
      <button class="primary" id="cameraBtn">📷 Scan</button>
    </div>
    <input type="file" id="csvInput" accept=".csv,text/csv" multiple hidden>
    <input type="file" id="imgInput" accept="image/*" multiple hidden>
    <input type="file" id="cameraInput" accept="image/*" capture="environment" hidden>
  </div>

  <section class="view active" id="view-overview"></section>
  <section class="view" id="view-transactions">
    <div class="filters">
      <input type="search" id="fSearch" placeholder="Search description…">
      <select id="fAccount"><option value="">All accounts</option></select>
      <select id="fCategory"><option value="">All categories</option></select>
      <input type="date" id="fFrom" title="From date">
      <input type="date" id="fTo" title="To date">
    </div>
    <div class="bulkbar" id="bulkbar"></div>
    <div class="card tablewrap" id="txTableWrap"></div>
  </section>
  <section class="view" id="view-jars"></section>
  <section class="view" id="view-budgets">
    <div class="formrow" style="margin-bottom:16px">
      <label>Month</label>
      <input type="month" id="budgetMonth" style="flex:none">
    </div>
    <div class="card" id="budgetList"></div>
  </section>
</main>

<nav class="tabbar">
  <button data-view="overview" class="active"><svg viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round"><path d="M3 12l9-8 9 8M5 10v10h5v-6h4v6h5V10"/></svg>Overview</button>
  <button data-view="transactions"><svg viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>Activity</button>
  <button data-view="jars"><svg viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round"><path d="M6 8h12l-1 12H7L6 8zM9 8V5a3 3 0 0 1 6 0v3"/></svg>Jars</button>
  <button data-view="budgets"><svg viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 3v9l6 4"/></svg>Budgets</button>
</nav>

<div class="modal-backdrop" id="mappingModal"><div class="modal" id="mappingBody"></div></div>
<div class="modal-backdrop" id="receiptModal"><div class="modal" id="receiptBody"></div></div>
<div class="modal-backdrop" id="settingsModal"><div class="modal" id="settingsBody"></div></div>
<div class="modal-backdrop" id="editModal"><div class="modal" id="editBody"></div></div>
<div class="modal-backdrop" id="jarModal"><div class="modal" id="jarBody"></div></div>
<div class="toast" id="toast"></div>

<script>
'use strict';

/* ---------- storage: IndexedDB with localStorage fallback ---------- */
const DB = (() => {
  let db = null;
  let useLS = !('indexedDB' in window);
  function open() {
    if (useLS) return Promise.resolve(null);
    return new Promise((resolve) => {
      const req = indexedDB.open('ledger', 1);
      req.onupgradeneeded = () => {
        const d = req.result;
        if (!d.objectStoreNames.contains('tx')) d.createObjectStore('tx', { keyPath: 'id' });
        if (!d.objectStoreNames.contains('kv')) d.createObjectStore('kv');
        if (!d.objectStoreNames.contains('receipts')) d.createObjectStore('receipts');
      };
      req.onsuccess = () => { db = req.result; resolve(db); };
      req.onerror = () => { useLS = true; resolve(null); };
    });
  }
  function store(name, mode) { return db.transaction(name, mode).objectStore(name); }
  function prom(req) { return new Promise((res, rej) => { req.onsuccess = () => res(req.result); req.onerror = () => rej(req.error); }); }
  return {
    open,
    async getAllTx() {
      if (useLS) return JSON.parse(localStorage.getItem('ledger.tx') || '[]');
      return prom(store('tx', 'readonly').getAll());
    },
    async putTx(items) {
      if (useLS) {
        const all = JSON.parse(localStorage.getItem('ledger.tx') || '[]');
        const map = new Map(all.map(t => [t.id, t]));
        items.forEach(t => map.set(t.id, t));
        localStorage.setItem('ledger.tx', JSON.stringify([...map.values()]));
        return;
      }
      return new Promise((res, rej) => {
        const txn = db.transaction('tx', 'readwrite'); const s = txn.objectStore('tx');
        items.forEach(t => s.put(t));
        txn.oncomplete = () => res(); txn.onerror = () => rej(txn.error);
      });
    },
    async deleteTx(ids) {
      if (useLS) {
        const set = new Set(ids);
        const all = JSON.parse(localStorage.getItem('ledger.tx') || '[]').filter(t => !set.has(t.id));
        localStorage.setItem('ledger.tx', JSON.stringify(all));
        return;
      }
      return new Promise((res, rej) => {
        const txn = db.transaction('tx', 'readwrite'); const s = txn.objectStore('tx');
        ids.forEach(id => s.delete(id));
        txn.oncomplete = () => res(); txn.onerror = () => rej(txn.error);
      });
    },
    async kvGet(key, fallback) {
      if (useLS) { const v = localStorage.getItem('ledger.kv.' + key); return v === null ? fallback : JSON.parse(v); }
      const v = await prom(store('kv', 'readonly').get(key));
      return v === undefined ? fallback : v;
    },
    async kvSet(key, val) {
      if (useLS) { localStorage.setItem('ledger.kv.' + key, JSON.stringify(val)); return; }
      return prom(store('kv', 'readwrite').put(val, key));
    },
    async putReceipt(id, blob) { if (useLS) return; return prom(store('receipts', 'readwrite').put(blob, id)); },
    async getReceipt(id) { if (useLS) return null; return prom(store('receipts', 'readonly').get(id)); },
    async wipe() {
      if (useLS) { Object.keys(localStorage).filter(k => k.startsWith('ledger.')).forEach(k => localStorage.removeItem(k)); return; }
      await Promise.all(['tx', 'kv', 'receipts'].map(s => prom(store(s, 'readwrite').clear())));
    },
  };
})();

/* ---------- state ---------- */
const S = {
  tx: [], txIds: new Set(),
  settings: { base: 'CAD', theme: 'light' },
  rates: [], budgets: {}, rules: {}, mappings: {}, accounts: {},
  jars: [], catJar: {}, jarMoves: [],

const HEADER_HINTS = {
  date: ['date','transaction date','posted','buchungstag','datum','process date','trans date'],
  desc: ['description','merchant','payee','details','memo','narrative','verwendungszweck','transaction details'],
  amount: ['amount','value','betrag','transaction amount','net amount'],
  debit: ['debit','withdrawal','money out','paid out','soll'],
  credit: ['credit','deposit','money in','paid in','haben'],
  currency: ['currency','ccy','währung','curr'], account: ['account','card','konto'],

    for (const hints of Object.values(HEADER_HINTS)) if (cells.some(c => hints.some(h => c === h || c.includes(h)))) score++;
    if (cells.every(c => parseAmount(c) === null || /[a-z]/.test(c))) score += 0.5;
    if (score > bestScore) { bestScore = score; best = i; }

}
function guessColumns(header, dataRows) {
  const lower = header.map(h => h.toLowerCase().trim());
  const guess = { date: -1, desc: -1, amount: -1, debit: -1, credit: -1, currency: -1, account: -1 }; const claimed = new Set();
  for (const key of ['date','debit','credit','currency','account','amount','desc']) {
    for (let i = 0; i < lower.length; i++) { if (claimed.has(i)) continue; if (HEADER_HINTS[key].some(h => lower[i] === h || lower[i].includes(h))) { guess[key] = i; claimed.add(i); break; } }
  }

  if (guess.date < 0) for (let i = 0; i < colCount; i++) { if (claimed.has(i)) continue; if (sample.filter(r => parseDateFlexible(r[i])).length >= sample.length * 0.7) { guess.date = i; claimed.add(i); break; } }
  if (guess.amount < 0 && guess.debit < 0) for (let i = 0; i < colCount; i++) { if (claimed.has(i)) continue; if (sample.filter(r => r[i] && parseAmount(r[i]) !== null && !/[a-z]{3,}/i.test(String(r[i]).replace(/CAD|USD|EUR/gi, ''))).length >= sample.length * 0.7) { guess.amount = i; claimed.add(i); break; } }

/* ---------- import flow ---------- */
const importQueue = []; let importing = false;
async function handleFiles(files) {
  for (const f of files) {
    if (/\.csv$/i.test(f.name) || f.type.includes('csv')) importQueue.push({ type: 'csv', file: f });
    else if (f.type.startsWith('image/')) importQueue.push({ type: 'img', file: f });
    else toast(`Skipped ${f.name} (unsupported)`);
  }
  processQueue();
}
async function processQueue() {
  if (importing) return; importing = true;
  while (importQueue.length) { const item = importQueue.shift(); try { if (item.type === 'csv') await importCSVFile(item.file); else await scanReceipt(item.file); } catch (e) { console.error(e); toast(`Failed: ${item.file.name} — ${e.message}`); } }
  importing = false;
}
async function importCSVFile(file) {
  const text = await file.text(); const rows = parseCSV(text);
  if (rows.length < 2) throw new Error('no rows found');
  const headerIdx = findHeaderRow(rows); const header = rows[headerIdx];
  const dataRows = rows.slice(headerIdx + 1).filter(r => r.length >= 2);
  const signature = hashStr(header.join('|') + '|' + header.length);
  let cfg = S.mappings[signature];
  if (!cfg) {
    const guess = guessColumns(header, dataRows);
    const dayFirst = guess.date >= 0 ? detectDayFirst(dataRows.map(r => r[guess.date])) : false;
    let curGuess = null;
    if (guess.currency < 0) for (const r of dataRows.slice(0, 10)) curGuess = detectCurrencyFromText(r[guess.amount >= 0 ? guess.amount : 0]) || curGuess;
    cfg = { cols: guess, dayFirst, flipSign: false, account: file.name.replace(/\.csv$/i, '').replace(/[_-]/g, ' ').slice(0, 30), currency: curGuess || S.settings.base };
    cfg = await showMappingModal(file.name, header, dataRows, cfg, signature);
    if (!cfg) { toast('Import cancelled'); return; }
  }
  const { added, skipped, failed } = await ingestRows(dataRows, cfg);
  if (!(cfg.account in S.accounts)) { S.accounts[cfg.account] = { currency: cfg.currency }; await DB.kvSet('accounts', S.accounts); }
  toast(`${file.name}: ${added} imported, ${skipped} duplicates skipped${failed ? ', ' + failed + ' unparseable' : ''}`);
  renderAll();
}
async function ingestRows(dataRows, cfg) {
  const c = cfg.cols; let added = 0, skipped = 0, failed = 0; const newTx = [];
  for (const r of dataRows) {
    const date = parseDateFlexible(r[c.date], cfg.dayFirst); const desc = String(r[c.desc] ?? '').trim(); let amount = null;
    if (c.debit >= 0 || c.credit >= 0) {
      const deb = c.debit >= 0 ? parseAmount(r[c.debit]) : null; const cred = c.credit >= 0 ? parseAmount(r[c.credit]) : null;
      if (deb !== null && deb !== 0) amount = -Math.abs(deb); else if (cred !== null && cred !== 0) amount = Math.abs(cred); else if (deb === 0 || cred === 0) amount = 0;
    } else if (c.amount >= 0) amount = parseAmount(r[c.amount]);
    if (date === null || amount === null || !desc) { failed++; continue; }
    if (cfg.flipSign) amount = -amount;
    let currency = cfg.currency;
    if (c.currency >= 0) { const rc = detectCurrencyFromText(r[c.currency]) || String(r[c.currency]).trim().toUpperCase(); if (/^[A-Z]{3}$/.test(rc)) currency = rc; }
    else { const sym = detectCurrencyFromText(String(r[c.amount] ?? '')); if (sym) currency = sym; }
    const cat = categorize(desc);
    const t = { date, desc, amount, currency, account: cfg.account, source: 'csv', category: cat, transfer: cat === 'Transfer' || cat === 'Investments' };
    t.id = txHash(t);
    if (S.txIds.has(t.id) || newTx.some(x => x.id === t.id)) { skipped++; continue; }
    newTx.push(t); added++;
  }
  if (newTx.length) { await DB.putTx(newTx); S.tx.push(...newTx); newTx.forEach(t => S.txIds.add(t.id)); }
  return { added, skipped, failed };
}

/* ---------- aggregation ---------- */
function monthAgg() {
  const agg = {};
  for (const t of S.tx) { if (isTransfer(t)) continue; const mk = monthKey(t.date); agg[mk] = agg[mk] || { income: 0, expense: 0 }; const v = toBase(t.amount, t.currency); if (v >= 0) agg[mk].income += v; else agg[mk].expense += -v; }
  return agg;
}
function categorySpend(mk) {
  const out = {};
  for (const t of S.tx) { if (t.amount >= 0 || isTransfer(t)) continue; if (mk && monthKey(t.date) !== mk) continue; out[t.category] = (out[t.category] || 0) + -toBase(t.amount, t.currency); }
  return out;
}
function jarBalances() {
  const bal = {}; S.jars.forEach(j => bal[j.id] = 0);
  const totPct = S.jars.reduce((s, j) => s + j.pct, 0) || 1;
  for (const t of S.tx) {
    if (isTransfer(t)) continue; const v = toBase(t.amount, t.currency);
    if (v > 0) S.jars.forEach(j => bal[j.id] += v * j.pct / totPct);
    else { const jid = txJar(t); if (jid && bal[jid] !== undefined) bal[jid] += v; }
  }
  for (const m of S.jarMoves) { if (bal[m.from] !== undefined) bal[m.from] -= m.amount; if (bal[m.to] !== undefined) bal[m.to] += m.amount; }
  return bal;
}
function jarSpendThisMonth(jid, mk) {
  let s = 0;
  for (const t of S.tx) { if (t.amount >= 0 || isTransfer(t)) continue; if (monthKey(t.date) !== mk) continue; if (txJar(t) === jid) s += -toBase(t.amount, t.currency); }
  return s;
}

/* ---------- recurring detection ---------- */
function detectRecurring() {
  const groups = {};
  for (const t of S.tx) { if (t.amount >= 0 || isTransfer(t)) continue; const k = merchantKey(t.desc); (groups[k] = groups[k] || []).push(t); }
  const out = [];
  for (const k in groups) {
    const items = groups[k].slice().sort((a, b) => a.date < b.date ? -1 : 1);
    if (items.length < 2) continue;
    const days = items.map(t => Date.parse(t.date) / 86400000);
    const gaps = []; for (let i = 1; i < days.length; i++) gaps.push(days[i] - days[i - 1]);
    gaps.sort((a, b) => a - b); const med = gaps[Math.floor(gaps.length / 2)];
    if (med < 24 || med > 40) continue;
    const amts = items.map(t => Math.abs(toBase(t.amount, t.currency)));
    const first = amts[0], last = amts[amts.length - 1];
    const mid = amts.slice().sort((a, b) => a - b)[Math.floor(amts.length / 2)] || 1;
    const stable = (Math.max(...amts) - Math.min(...amts)) / mid < 0.08;
    let monotonicUp = last > first * 1.03; for (let i = 1; i < amts.length; i++) if (amts[i] < amts[i - 1] * 0.99) monotonicUp = false;
    if (!stable && !monotonicUp) continue; // recurring bills/subs only: fixed or steadily rising, not fluctuating spend
    out.push({ name: items[items.length - 1].desc, monthly: last, annual: last * 12, count: items.length, cat: items[items.length - 1].category, hike: monotonicUp && last > first * 1.03 ? { from: first, to: last } : null });
  }
  return out.sort((a, b) => b.monthly - a.monthly);
}

/* ---------- charts ---------- */
function sparkline() {
  const sorted = [...S.tx].sort((a, b) => a.date < b.date ? -1 : 1);
  if (sorted.length < 2) return '';
  const pts = []; let sum = 0; for (const t of sorted) { sum += toBase(t.amount, t.currency); pts.push(sum); }
  const W = 600, H = 90; const min = Math.min(...pts, 0), max = Math.max(...pts, 1);
  const x = (i) => (i / (pts.length - 1)) * W; const y = (v) => 8 + (H - 16) * (1 - (v - min) / (max - min || 1));
  const path = pts.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('');
  return `<svg class="chart spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <defs><linearGradient id="sparkfill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity="0.22"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>
    <path d="${path}L${W},${H}L0,${H}Z" fill="url(#sparkfill)"/><path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}
function donutChart(entries, centerLabel, centerValue) {
  const total = entries.reduce((s, e) => s + e.value, 0) || 1; const R = 52, CIRC = 2 * Math.PI * R; let offset = 0;
  const segs = entries.map(e => { const frac = e.value / total; const seg = `<circle cx="70" cy="70" r="${R}" fill="none" stroke="${e.color}" stroke-width="16" stroke-dasharray="${(frac * CIRC).toFixed(2)} ${CIRC.toFixed(2)}" stroke-dashoffset="${(-offset * CIRC).toFixed(2)}" transform="rotate(-90 70 70)"><title>${esc(e.label)}: ${esc(e.fmt)}</title></circle>`; offset += frac; return seg; }).join('');
  return `<div style="display:flex;flex-direction:column;align-items:center;gap:6px">
    <svg width="140" height="140" viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg">${segs}<text x="70" y="75" text-anchor="middle" font-size="12" fill="var(--muted)" font-family="var(--body)">${esc(centerLabel)}</text></svg>
    <span class="num" style="font-family:var(--display);font-size:17px;font-weight:600">${esc(centerValue)}</span></div>`;
}
function trendChart(months, agg) {
  if (!months.length) return '<div class="sub">No data.</div>';
  const W = 600, H = 190, pad = 26, bw = (W - pad * 2) / months.length;
  const maxV = Math.max(...months.flatMap(m => [agg[m].income, agg[m].expense]), 1); const y = (v) => H - 26 - (v / maxV) * (H - 50); let bars = '';
  months.forEach((m, i) => {
    const x = pad + i * bw; const iw = Math.min(24, bw * 0.30); const yi = y(agg[m].income), ye = y(agg[m].expense);
    bars += `<rect x="${(x + bw / 2 - iw - 2).toFixed(1)}" y="${yi.toFixed(1)}" width="${iw}" height="${(H - 26 - yi).toFixed(1)}" rx="5" fill="var(--accent)"><title>${monthLabel(m)} income: ${esc(baseFmt(agg[m].income))}</title></rect>`;
    bars += `<rect x="${(x + bw / 2 + 2).toFixed(1)}" y="${ye.toFixed(1)}" width="${iw}" height="${(H - 26 - ye).toFixed(1)}" rx="5" fill="var(--coral)" opacity="0.85"><title>${monthLabel(m)} spend: ${esc(baseFmt(agg[m].expense))}</title></rect>`;
    bars += `<text x="${(x + bw / 2).toFixed(1)}" y="${H - 8}" text-anchor="middle" font-size="11" fill="var(--muted)">${monthLabel(m)}</text>`;

/* ---------- boot ---------- */
async function initDefaults() {
  if (!S.rates.length) { S.rates = [{ cur: 'USD', eurPer: 0.92, date: todayISO() }, { cur: 'CAD', eurPer: 0.67, date: todayISO() }]; await DB.kvSet('rates', S.rates); }

}
async function boot() {
  await DB.open();
  S.tx = await DB.getAllTx(); S.txIds = new Set(S.tx.map(t => t.id));
  S.settings = await DB.kvGet('settings', { base: 'CAD', theme: 'light' });
  S.rates = await DB.kvGet('rates', []); S.budgets = await DB.kvGet('budgets', {}); S.rules = await DB.kvGet('rules', {});
  S.mappings = await DB.kvGet('mappings', {}); S.accounts = await DB.kvGet('accounts', {});
  S.jars = await DB.kvGet('jars', []); S.catJar = await DB.kvGet('catJar', {}); S.jarMoves = await DB.kvGet('jarMoves', []);

document.addEventListener('click', (e) => { const tr = e.target.closest('#txTable tbody tr'); if (tr && !e.target.closest('.catselect,.rowchk,.jartag,.selcol')) { const t = S.tx.find(x => x.id === tr.dataset.id); if (t) openTxModal(t); } });
$$('.modal-backdrop').forEach(m => m.addEventListener('click', (e) => { if (e.target === m) m.classList.remove('open'); }));
const dz = $('#dropzone');
['dragover', 'dragenter'].forEach(ev => dz.addEventListener(ev, (e) => { e.preventDefault(); dz.classList.add('drag'); }));
['dragleave', 'drop'].forEach(ev => dz.addEventListener(ev, (e) => { e.preventDefault(); dz.classList.remove('drag'); }));
dz.addEventListener('drop', (e) => handleFiles([...e.dataTransfer.files]));
['fSearch', 'fAccount', 'fCategory', 'fFrom', 'fTo'].forEach(id => $('#' + id).addEventListener('input', renderTransactions));
$('#budgetMonth').addEventListener('input', renderBudgets);

if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(e => console.warn('SW registration failed', e));
const tesScript = document.createElement('script'); tesScript.src = './vendor/tesseract.min.js'; document.head.appendChild(tesScript);
boot();
</script>
</body>
</html>
